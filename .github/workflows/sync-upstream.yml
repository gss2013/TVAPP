name: Sync upstream

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/youhunwl/TVAPP.git

      - name: Fetch upstream
        run: git fetch upstream --depth=1

      - name: Merge upstream into main
        run: |
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories

      - name: Push
        run: git push origin main
