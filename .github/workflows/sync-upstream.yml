name: Sync fork

on:
  schedule:
    - cron: '0 20 * * *'   # 北京时间每天 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync gss2013/TVAPP --source youhunwl/TVAPP --branch main --force
